<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Gioco della Tela (Mulino)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    :root {
      --bg: #f3f3f3;
      --card: #ffffff;
      --border: #333333;
      --shadow-soft: 0 2px 8px rgba(0,0,0,0.18);
      --radius: 12px;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top, #e0e0e0, #f6f6f6);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #222;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      padding: 12px 12px 16px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin: 4px 0 8px;
    }

    #status {
      margin: 6px 0 10px;
      padding: 8px 10px;
      min-height: 32px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    #top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .top-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    label {
      white-space: nowrap;
    }

    select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #555;
      font-size: 0.9rem;
      background: #ffffff;
    }

    button {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      cursor: pointer;
      background: #ffffff;
      font-size: 0.9rem;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(0.97);
    }

    button:hover {
      background: #ececec;
    }

    .board-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .board {
      position: relative;
      width: min(90vw, 480px);
      height: min(90vw, 480px);
      max-width: 480px;
      max-height: 480px;
      background: #fdfdfd;
      border: 2px solid #333;
      border-radius: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
      touch-action: manipulation;
    }

    .square {
      position: absolute;
      border: 2px solid #333;
      border-radius: 10px;
      pointer-events: none;
    }
    .square.outer {
      top: 6%;
      left: 6%;
      right: 6%;
      bottom: 6%;
    }
    .square.middle {
      top: 22%;
      left: 22%;
      right: 22%;
      bottom: 22%;
    }
    .square.inner {
      top: 38%;
      left: 38%;
      right: 38%;
      bottom: 38%;
    }

    .connector {
      position: absolute;
      background: #333;
      pointer-events: none;
    }
    .connector.horizontal {
      height: 2px;
      left: 6%;
      right: 6%;
      top: 50%;
      transform: translateY(-50%);
    }
    .connector.vertical {
      width: 2px;
      top: 6%;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
    }

    .point {
      width: clamp(32px, 7vw, 44px);
      height: clamp(32px, 7vw, 44px);
      border-radius: 50%;
      border: 2px solid #333;
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      cursor: pointer;
      background: #f9f9f9;
      transition: transform 0.07s ease, box-shadow 0.07s ease, background 0.07s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .point:hover {
      box-shadow: 0 0 6px rgba(0,0,0,0.25);
      transform: translate(-50%, -50%) scale(1.04);
    }

    .point.human {
      background: #d32f2f;
      border-color: #5a0000;
    }

    .point.ai {
      background: #1976d2;
      border-color: #003c75;
    }

    .point.selected {
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
      transform: translate(-50%, -50%) scale(1.1);
    }

    .point.removable {
      box-shadow: 0 0 10px rgba(255,215,0,1);
    }

    .legend {
      margin-top: 4px;
      font-size: 0.85rem;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #333;
    }

    .legend-dot.human {
      background: #d32f2f;
      border-color: #5a0000;
    }

    .legend-dot.ai {
      background: #1976d2;
      border-color: #003c75;
    }

    #winner-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #winner-box {
      background: #ffffff;
      padding: 18px 22px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      max-width: 90%;
      animation: pop 0.25s ease-out;
    }

    #winner-title {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    #winner-text {
      font-size: 1rem;
      margin-bottom: 10px;
    }

    #winner-box button {
      margin-top: 4px;
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.2rem;
      }
      #top-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .top-group {
        justify-content: space-between;
      }
      button, select {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Gioco della Tela (Mulino)</h1>
    <div id="status"></div>

    <div id="top-bar">
      <div class="top-group">
        <label for="difficulty">Difficoltà:</label>
        <select id="difficulty" onchange="onDifficultyChange()">
          <option value="easy">Facile</option>
          <option value="medium" selected>Medio</option>
          <option value="hard">Difficile</option>
        </select>
      </div>
      <div class="top-group">
        <label for="starter">Chi inizia:</label>
        <select id="starter">
          <option value="human" selected>Tu</option>
          <option value="ai">Computer</option>
        </select>
      </div>
      <button onclick="resetGame()">Nuova partita</button>
    </div>

    <div class="board-wrapper">
      <div id="board" class="board">
        <div class="square outer"></div>
        <div class="square middle"></div>
        <div class="square inner"></div>
        <div class="connector horizontal"></div>
        <div class="connector vertical"></div>
      </div>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="legend-dot human"></span> Tu (ROSSO)</span>
      <span class="legend-item"><span class="legend-dot ai"></span> Computer (BLU)</span>
    </div>

    <div id="winner-overlay">
      <div id="winner-box">
        <div id="winner-title"></div>
        <div id="winner-text"></div>
        <button onclick="resetGame()">Gioca un'altra partita</button>
      </div>
    </div>
  </div>

  <script>
    const HUMAN = 'H';
    const AI = 'A';
    let difficulty = 'medium';

    const positions = [
      { x: 6,  y: 6  },  // 0
      { x: 50, y: 6  },  // 1
      { x: 94, y: 6  },  // 2
      { x: 22, y: 22 },  // 3
      { x: 50, y: 22 },  // 4
      { x: 78, y: 22 },  // 5
      { x: 38, y: 38 },  // 6
      { x: 50, y: 38 },  // 7
      { x: 62, y: 38 },  // 8
      { x: 6,  y: 50 },  // 9
      { x: 22, y: 50 },  // 10
      { x: 38, y: 50 },  // 11
      { x: 62, y: 50 },  // 12
      { x: 78, y: 50 },  // 13
      { x: 94, y: 50 },  // 14
      { x: 38, y: 62 },  // 15
      { x: 50, y: 62 },  // 16
      { x: 62, y: 62 },  // 17
      { x: 22, y: 78 },  // 18
      { x: 50, y: 78 },  // 19
      { x: 78, y: 78 },  // 20
      { x: 6,  y: 94 },  // 21
      { x: 50, y: 94 },  // 22
      { x: 94, y: 94 }   // 23
    ];

    const adjacency = {
      0: [1, 9],
      1: [0, 2, 4],
      2: [1, 14],
      3: [4, 10],
      4: [1, 3, 5, 7],
      5: [4, 13],
      6: [7, 11],
      7: [4, 6, 8],
      8: [7, 12],
      9: [0, 10, 21],
      10: [3, 9, 11, 18],
      11: [6, 10, 15],
      12: [8, 13, 17],
      13: [5, 12, 14, 20],
      14: [2, 13, 23],
      15: [11, 16],
      16: [15, 17, 19],
      17: [12, 16],
      18: [10, 19],
      19: [16, 18, 20, 22],
      20: [13, 19],
      21: [9, 22],
      22: [19, 21, 23],
      23: [14, 22]
    };

    const mills = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [15, 16, 17], [18, 19, 20], [21, 22, 23],
      [0, 9, 21], [3, 10, 18], [6, 11, 15],
      [2, 14, 23], [5, 13, 20], [8, 12, 17],
      [1, 4, 7], [16, 19, 22],
      [9, 10, 11], [12, 13, 14]
    ];

    const millsByPos = Array.from({ length: 24 }, () => []);
    mills.forEach((mill, idx) => mill.forEach(p => millsByPos[p].push(idx)));

    let board;
    let phase;
    let currentPlayer;
    let humanPiecesPlaced;
    let aiPiecesPlaced;
    let humanPiecesOnBoard;
    let aiPiecesOnBoard;
    let selectedPosition;
    let removeModeFor;
    let gameOver;

    function onDifficultyChange() {
      difficulty = document.getElementById('difficulty').value;
    }

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function showWinner(title, text) {
      const overlay = document.getElementById('winner-overlay');
      document.getElementById('winner-title').textContent = title;
      document.getElementById('winner-text').textContent = text;
      overlay.style.display = 'flex';
    }

    function hideWinner() {
      const overlay = document.getElementById('winner-overlay');
      overlay.style.display = 'none';
    }

    function getPositionsOf(player, boardState = board) {
      const out = [];
      for (let i = 0; i < boardState.length; i++) {
        if (boardState[i] === player) out.push(i);
      }
      return out;
    }

    function isMillAt(pos, player, boardState = board) {
      return millsByPos[pos].some(mi => mills[mi].every(p => boardState[p] === player));
    }

    function isInAnyMill(pos, player, boardState = board) {
      return isMillAt(pos, player, boardState);
    }

    function getCriticalPositionsFor(player, boardState = board) {
      const critical = new Set();
      mills.forEach(triple => {
        let countPlayer = 0;
        let empty = null;
        triple.forEach(p => {
          if (boardState[p] === player) countPlayer++;
          else if (boardState[p] === null) empty = p;
        });
        if (countPlayer === 2 && empty !== null) critical.add(empty);
      });
      return critical;
    }

    function hasLegalMoves(player) {
      const pieces = getPositionsOf(player);
      const count = pieces.length;
      if (count === 0) return false;

      if (phase === 'placing') {
        return board.some(v => v === null);
      }

      const pieceCount = (player === HUMAN ? humanPiecesOnBoard : aiPiecesOnBoard);
      const canFly = pieceCount <= 3;

      if (canFly) {
        return board.some(v => v === null);
      }

      return pieces.some(p => adjacency[p].some(n => board[n] === null));
    }

    function getAllLegalMoves(player) {
      const moves = [];
      if (phase === 'placing') {
        for (let i = 0; i < board.length; i++) {
          if (board[i] === null) moves.push({ type: 'place', to: i });
        }
        return moves;
      }

      const pieces = getPositionsOf(player);
      const pieceCount = (player === HUMAN ? humanPiecesOnBoard : aiPiecesOnBoard);
      const canFly = pieceCount <= 3;

      pieces.forEach(from => {
        if (canFly) {
          for (let to = 0; to < board.length; to++) {
            if (board[to] === null) moves.push({ type: 'move', from, to });
          }
        } else {
          adjacency[from].forEach(to => {
            if (board[to] === null) moves.push({ type: 'move', from, to });
          });
        }
      });
      return moves;
    }

    function simulateMoveOnState(move, player, boardState) {
      const temp = boardState.slice();
      if (move.type === 'place') {
        temp[move.to] = player;
      } else {
        temp[move.from] = null;
        temp[move.to] = player;
      }
      return temp;
    }

    function simulateMove(move, player, boardState) {
      return simulateMoveOnState(move, player, boardState);
    }

    function simulateMoveAndFormsMill(move, player) {
      const temp = simulateMoveOnState(move, player, board);
      return isMillAt(move.to, player, temp);
    }

    function countMills(player, boardState) {
      let cnt = 0;
      mills.forEach(m => {
        if (m.every(p => boardState[p] === player)) cnt++;
      });
      return cnt;
    }

    function countPotentialMills(player, boardState) {
      let cnt = 0;
      mills.forEach(triple => {
        let cPlayer = 0;
        let cEmpty = 0;
        triple.forEach(p => {
          if (boardState[p] === player) cPlayer++;
          else if (boardState[p] === null) cEmpty++;
        });
        if (cPlayer === 2 && cEmpty === 1) cnt++;
      });
      return cnt;
    }

    function getLegalMovesEval(player, boardState, phaseEval) {
      const moves = [];
      if (phaseEval === 'placing') {
        for (let i = 0; i < boardState.length; i++) {
          if (boardState[i] === null) moves.push({ type: 'place', to: i });
        }
        return moves;
      }
      const pieces = getPositionsOf(player, boardState);
      const pieceCount = pieces.length;
      const canFly = pieceCount <= 3;

      pieces.forEach(from => {
        if (canFly) {
          for (let to = 0; to < boardState.length; to++) {
            if (boardState[to] === null) moves.push({ type: 'move', from, to });
          }
        } else {
          (adjacency[from] || []).forEach(to => {
            if (boardState[to] === null) moves.push({ type: 'move', from, to });
          });
        }
      });
      return moves;
    }

    function evaluateBoardForAI(boardState) {
      const aiPieces = getPositionsOf(AI, boardState).length;
      const hPieces = getPositionsOf(HUMAN, boardState).length;
      const aiMills = countMills(AI, boardState);
      const hMills = countMills(HUMAN, boardState);
      const aiPot = countPotentialMills(AI, boardState);
      const hPot = countPotentialMills(HUMAN, boardState);

      const aiMoves = getLegalMovesEval(AI, boardState, phase).length;
      const hMoves = getLegalMovesEval(HUMAN, boardState, phase).length;

      return (aiPieces - hPieces) * 12 +
             (aiMills - hMills) * 45 +
             (aiPot - hPot) * 8 +
             (aiMoves - hMoves) * 3;
    }

    function chooseHardMove(moves, criticalForHuman) {
      // Mini-minimax a profondità 2 (AI -> Human)
      let bestScore = -Infinity;
      let bestMoves = [];

      const phaseEval = phase;

      moves.forEach(m => {
        const afterAIMove = simulateMoveOnState(m, AI, board);
        let baseScore = evaluateBoardForAI(afterAIMove);

        if (isMillAt(m.to, AI, afterAIMove)) {
          baseScore += 60;
        }
        if (criticalForHuman.has(m.to)) {
          baseScore += 25;
        }

        const humanReplies = getLegalMovesEval(HUMAN, afterAIMove, phaseEval);

        let worstForAI;
        if (humanReplies.length === 0) {
          // Nessuna risposta umana: molto buono per l'AI
          worstForAI = baseScore + 80;
        } else {
          worstForAI = Infinity;
          humanReplies.forEach(hr => {
            const afterHuman = simulateMoveOnState(hr, HUMAN, afterAIMove);
            let replyScore = evaluateBoardForAI(afterHuman);
            if (isMillAt(hr.to, HUMAN, afterHuman)) {
              replyScore -= 50;
            }
            if (replyScore < worstForAI) worstForAI = replyScore;
          });
        }

        const moveScore = worstForAI;

        if (moveScore > bestScore + 1e-6) {
          bestScore = moveScore;
          bestMoves = [m];
        } else if (Math.abs(moveScore - bestScore) < 1e-6) {
          bestMoves.push(m);
        }
      });

      if (bestMoves.length === 0) {
        return moves[Math.floor(Math.random() * moves.length)];
      }
      return bestMoves[Math.floor(Math.random() * bestMoves.length)];
    }

    function aiRemoveHumanPiece() {
      const humanPos = getPositionsOf(HUMAN);
      if (humanPos.length === 0) return;

      let removable = humanPos.filter(p => !isInAnyMill(p, HUMAN));
      if (removable.length === 0) removable = humanPos;

      const choice = removable[Math.floor(Math.random() * removable.length)];
      board[choice] = null;
      humanPiecesOnBoard--;

      checkWin();
    }

    function aiMove() {
      if (gameOver) return;

      if (!hasLegalMoves(AI) && phase === 'moving') {
        setStatus('Niente mosse per il computer: hai vinto!');
        showWinner('Hai vinto!', 'Il computer non ha più mosse disponibili.');
        gameOver = true;
        return;
      }

      const moves = getAllLegalMoves(AI);
      if (moves.length === 0) {
        setStatus('Niente mosse per il computer: hai vinto!');
        showWinner('Hai vinto!', 'Il computer non ha più mosse disponibili.');
        gameOver = true;
        return;
      }

      const criticalForHuman = getCriticalPositionsFor(HUMAN);

      let chosen;
      if (difficulty === 'easy') {
        chosen = moves[Math.floor(Math.random() * moves.length)];
      } else if (difficulty === 'medium') {
        const winningMoves = moves.filter(m => simulateMoveAndFormsMill(m, AI));
        const blockingMoves = moves.filter(m => criticalForHuman.has(m.to));

        if (winningMoves.length > 0) {
          chosen = winningMoves[Math.floor(Math.random() * winningMoves.length)];
        } else if (blockingMoves.length > 0) {
          chosen = blockingMoves[Math.floor(Math.random() * blockingMoves.length)];
        } else {
          chosen = moves[Math.floor(Math.random() * moves.length)];
        }
      } else {
        chosen = chooseHardMove(moves, criticalForHuman);
      }

      if (!chosen) {
        chosen = moves[Math.floor(Math.random() * moves.length)];
      }

      if (chosen.type === 'place') {
        board[chosen.to] = AI;
        aiPiecesPlaced++;
        aiPiecesOnBoard++;
        render();
        const formedMill = isMillAt(chosen.to, AI);
        if (humanPiecesPlaced === 9 && aiPiecesPlaced === 9) {
          phase = 'moving';
        }
        if (formedMill) {
          aiRemoveHumanPiece();
          render();
          if (gameOver) return;
        }
      } else {
        board[chosen.from] = null;
        board[chosen.to] = AI;
        render();
        const formedMill = isMillAt(chosen.to, AI);
        if (formedMill) {
          aiRemoveHumanPiece();
          render();
          if (gameOver) return;
        }
      }

      if (!gameOver) {
        currentPlayer = HUMAN;
        setStatus('Tocca a te.' + (phase === 'placing'
          ? ' Posiziona una pedina rossa.'
          : ' Muovi una pedina rossa.'));
      }
    }

    function onPointClick(e) {
      if (gameOver) return;
      const idx = parseInt(e.currentTarget.dataset.index, 10);

      if (removeModeFor === HUMAN) {
        handleHumanRemoval(idx);
        return;
      }

      if (currentPlayer !== HUMAN) return;

      if (phase === 'placing') {
        handleHumanPlacement(idx);
      } else {
        handleHumanMovement(idx);
      }
    }

    function handleHumanRemoval(idx) {
      if (board[idx] !== AI) {
        setStatus('Devi cliccare su una pedina blu del computer da rimuovere.');
        return;
      }

      const aiPos = getPositionsOf(AI);
      let nonMill = aiPos.filter(p => !isInAnyMill(p, AI));
      if (nonMill.length > 0 && isInAnyMill(idx, AI)) {
        setStatus('Se possibile, devi togliere una pedina NON in un mulino.');
        return;
      }

      board[idx] = null;
      aiPiecesOnBoard--;
      removeModeFor = null;
      render();
      checkWin();
      if (gameOver) return;

      currentPlayer = AI;
      setStatus('Turno del computer...');
      setTimeout(aiMove, 350);
    }

    function handleHumanPlacement(idx) {
      if (board[idx] !== null) return;

      board[idx] = HUMAN;
      humanPiecesPlaced++;
      humanPiecesOnBoard++;
      render();

      const formedMill = isMillAt(idx, HUMAN);
      if (humanPiecesPlaced === 9 && aiPiecesPlaced === 9) {
        phase = 'moving';
      }

      if (formedMill) {
        removeModeFor = HUMAN;
        highlightRemovablePieces(AI);
        setStatus('Hai formato un mulino! Clicca su una pedina blu da rimuovere.');
        return;
      }

      currentPlayer = AI;
      setStatus('Turno del computer...');
      setTimeout(aiMove, 350);
    }

    function handleHumanMovement(idx) {
      const canFly = humanPiecesOnBoard <= 3;

      if (selectedPosition === null) {
        if (board[idx] === HUMAN) {
          selectedPosition = idx;
          render();
        }
        return;
      }

      if (idx === selectedPosition) {
        selectedPosition = null;
        render();
        return;
      }

      if (board[idx] !== null) {
        if (board[idx] === HUMAN) {
          selectedPosition = idx;
          render();
        }
        return;
      }

      if (!canFly) {
        const neighbors = adjacency[selectedPosition] || [];
        if (!neighbors.includes(idx)) {
          setStatus('Puoi muovere solo lungo le linee verso una posizione adiacente libera.');
          return;
        }
      }

      board[selectedPosition] = null;
      board[idx] = HUMAN;
      selectedPosition = null;
      render();

      const formedMill = isMillAt(idx, HUMAN);
      if (formedMill) {
        removeModeFor = HUMAN;
        highlightRemovablePieces(AI);
        setStatus('Hai formato un mulino! Clicca su una pedina blu da rimuovere.');
        return;
      }

      currentPlayer = AI;
      setStatus('Turno del computer...');
      setTimeout(aiMove, 350);
    }

    function checkWin() {
      if (humanPiecesOnBoard < 3 && phase === 'moving') {
        setStatus('Ti restano meno di tre pedine: hai perso.');
        showWinner('Hai perso', 'Ti restano meno di tre pedine.');
        gameOver = true;
        return;
      }
      if (aiPiecesOnBoard < 3 && phase === 'moving') {
        setStatus('Al computer restano meno di tre pedine: hai vinto!');
        showWinner('Hai vinto!', 'Al computer restano meno di tre pedine.');
        gameOver = true;
        return;
      }

      if (phase === 'moving') {
        if (!hasLegalMoves(HUMAN) && currentPlayer === HUMAN) {
          setStatus('Non hai mosse disponibili: hai perso.');
          showWinner('Hai perso', 'Non hai più mosse disponibili.');
          gameOver = true;
        } else if (!hasLegalMoves(AI) && currentPlayer === AI) {
          setStatus('Il computer non ha mosse disponibili: hai vinto!');
          showWinner('Hai vinto!', 'Il computer non ha più mosse disponibili.');
          gameOver = true;
        }
      }
    }

    function highlightRemovablePieces(player) {
      const points = document.querySelectorAll('.point');
      points.forEach(p => p.classList.remove('removable'));

      const pos = getPositionsOf(player);
      let removable = pos.filter(i => !isInAnyMill(i, player));
      if (removable.length === 0) removable = pos;

      removable.forEach(i => {
        const el = document.querySelector('.point[data-index="' + i + '"]');
        if (el) el.classList.add('removable');
      });
    }

    function render() {
      const points = document.querySelectorAll('.point');
      points.forEach(p => {
        const idx = parseInt(p.dataset.index, 10);
        p.classList.remove('human', 'ai', 'selected', 'removable');
        const val = board[idx];
        if (val === HUMAN) p.classList.add('human');
        if (val === AI) p.classList.add('ai');
        if (selectedPosition === idx) p.classList.add('selected');
      });
    }

    function initBoardUI() {
      const boardDiv = document.getElementById('board');
      const oldPoints = boardDiv.querySelectorAll('.point');
      oldPoints.forEach(p => p.remove());

      positions.forEach((pos, idx) => {
        const p = document.createElement('div');
        p.classList.add('point');
        p.style.left = pos.x + '%';
        p.style.top = pos.y + '%';
        p.dataset.index = idx;
        p.addEventListener('click', onPointClick);
        boardDiv.appendChild(p);
      });

      render();
    }

    function resetGame() {
      board = Array(24).fill(null);
      phase = 'placing';
      humanPiecesPlaced = 0;
      aiPiecesPlaced = 0;
      humanPiecesOnBoard = 0;
      aiPiecesOnBoard = 0;
      selectedPosition = null;
      removeModeFor = null;
      gameOver = false;
      hideWinner();
      initBoardUI();

      const starter = document.getElementById('starter').value;
      if (starter === 'ai') {
        currentPlayer = AI;
        setStatus('Inizia il computer. Sta pensando alla prima mossa...');
        setTimeout(aiMove, 500);
      } else {
        currentPlayer = HUMAN;
        setStatus('Inizi tu. Posiziona una pedina rossa cliccando su un punto.');
      }
    }

    resetGame();
  </script>
</body>
</html>
